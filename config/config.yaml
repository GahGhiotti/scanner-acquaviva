# CONFIGURAZIONE DELLO SCANNER
# Qui si cambiano nome dei canali, link, firma e fonti senza toccare il codice.

canale:
  nome: Acquaviva Notizie
  telegram: https://t.me/acquavivanews
  whatsapp: https://whatsapp.com/channel/0029Vb7VMV1HltY99EaD2o2w

giunta:
  nome: Giunta di Castello di Acquaviva
  facebook: https://www.facebook.com/giuntacastello.diacquaviva
  instagram: https://www.instagram.com/giuntadicastello_acquaviva/

# Se la stessa notizia esce su più giornali, il post usa la prima fonte di questo elenco
# e mette le altre sotto "Anche su". Le fonti non elencate (es. Google News) vengono per ultime.
priorita_fonti:
  - San Marino RTV
  - Consiglio Grande e Generale
  - Ordinanze Affari Interni
  - GiornaleSM
  - Insider
  - Libertas

# Di notte non si pubblica: le notizie trovate escono tutte al primo giro del mattino.
# Ore di San Marino. Per disattivare, cancella queste tre righe.
silenzio_notturno:
  dalle: 22
  alle: 7

# Articoli più vecchi di così vengono ignorati (protezione contro i "ripescaggi").
eta_massima_giorni: 3

# Pausa tra un messaggio e l'altro su Telegram (secondi).
pausa_messaggi: 3

fonti:
  # sammarinese: true  -> la parola "Acquaviva" basta da sola
  # leggi_articolo: true -> se il feed non contiene le parole chiave, legge anche la pagina dell'articolo
  - nome: San Marino RTV
    tipo: rss
    sammarinese: true
    leggi_articolo: true
    url:
      - https://www.sanmarinortv.sm/rss.xml
      - https://www.sanmarinortv.sm/news/politica-c2.xml
      - https://www.sanmarinortv.sm/news/cronaca-c3.xml
      - https://www.sanmarinortv.sm/news/attualita-c4.xml
      - https://www.sanmarinortv.sm/news/economia-c5.xml
      - https://www.sanmarinortv.sm/news/cultura-c6.xml
      - https://www.sanmarinortv.sm/news/comunicati-c9.xml
      - https://www.sanmarinortv.sm/sport/calcio-sammarinese-c15.xml
      - https://www.sanmarinortv.sm/sport/sport-sammarinese-c16.xml

  - nome: GiornaleSM
    tipo: rss
    sammarinese: true
    leggi_articolo: true
    url:
      - https://giornalesm.com/feed/

  - nome: Insider
    tipo: rss
    sammarinese: true
    leggi_articolo: true
    url:
      - https://insider.sm/feed/

  - nome: Libertas
    tipo: rss
    sammarinese: true
    leggi_articolo: true
    url:
      - https://www.libertas.sm/feed/

  # Giornali italiani e altre testate, tramite le ricerche di Google News.
  # Il nome del giornale viene preso dal feed.
  - nome: Google News
    tipo: rss
    sammarinese: false
    leggi_articolo: false
    google_news: true
    url:
      - https://news.google.com/rss/search?q=Acquaviva+%22San+Marino%22&hl=it&gl=IT&ceid=IT:it
      - https://news.google.com/rss/search?q=Virtus+%22San+Marino%22+calcio&hl=it&gl=IT&ceid=IT:it
      - https://news.google.com/rss/search?q=Gualdicciolo+OR+Montecerreto+OR+%22Monte+Cerreto%22+OR+Moricce+OR+%22Costa+dello+Spino%22&hl=it&gl=IT&ceid=IT:it

  - nome: Ordinanze Affari Interni
    tipo: ordinanze
    sammarinese: true

  - nome: Consiglio Grande e Generale
    tipo: arengo
    sammarinese: true
    # controllate una volta al giorno: si presentano due volte l'anno
    ogni_ore: 20

# CATEGORIE: l'intestazione sopra il titolo di ogni post.
# Vale la prima categoria che corrisponde, nell'ordine scritto qui.
# Una categoria corrisponde se: la notizia viene da una delle "fonti", oppure il link
# contiene uno dei pezzi di "link", oppure una delle "parole" compare nel titolo,
# nelle categorie date dal giornale o nelle prime righe della descrizione.
categorie:
  - nome: Viabilità
    emoji: 🚧
    fonti: [Ordinanze Affari Interni]
    parole: [chiusura strada, chiusura della strada, strada chiusa, viabilita, senso unico, divieto di transito, lavori stradali]
  - nome: Istanze d'Arengo
    emoji: 🏛️
    fonti: [Consiglio Grande e Generale]
  - nome: Sport · Calcio
    emoji: ⚽
    parole: [virtus, calcio, calcio a 5, futsal, campionato sammarinese, academy, under 17, under 19, under 21, under 22, under 23, gol, partita, calciatore, calciatori, allenatore, serie d, difensore, attaccante, centrocampista, portiere, capolista, mister, trasferta, derby, coppa titano, girone, playoff, campionato, classifica, giornata, tre penne, la fiorita, tre fiori, folgore, cosmos, juvenes, pennarossa]
  - nome: Sport · Bocce
    emoji: 🎳
    parole: [bocce, bocciofila, bocciodromo]
  - nome: Sport · Motori
    emoji: 🏍️
    parole: [crossodromo, motocross, rally]
  - nome: Sport
    emoji: 🏅
    link: [/sport/]
    parole: [sport, torneo, poligono di tiro]
  - nome: Scuola
    emoji: 🎒
    parole: [scuola, scuole, nido, infanzia, elementare, elementari, faro bianco, girotondo, bruco verde]
  - nome: Comunità
    emoji: ⛪
    parole: [sant andrea, parrocchia, chiesa]
  - nome: Castello
    emoji: 🏰
    parole: [giunta di castello, capitano di castello]

# Se nessuna categoria corrisponde:
categoria_predefinita:
  nome: Notizie
  emoji: 📰
