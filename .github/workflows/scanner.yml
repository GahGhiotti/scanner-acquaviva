name: Scanner Acquaviva Notizie

on:
  schedule:
    - cron: "23 * * * *"   # ogni ora, al minuto 23
  workflow_dispatch:
    inputs:
      modalita:
        description: "normale = pubblica davvero · prova = mostra solo cosa pubblicherebbe · test-messaggio = il bot ti scrive in privato"
        type: choice
        options: [normale, prova, test-messaggio]
        default: normale

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scansione:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Strumenti per leggere i PDF scansionati (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita poppler-utils > /dev/null

      - run: pip install -q -r requirements.txt

      - name: Test del filtro
        run: python -m pytest -q tests

      - name: Scansione
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ "${{ inputs.modalita }}" = "prova" ]; then
            python -m scanner --prova
          elif [ "${{ inputs.modalita }}" = "test-messaggio" ]; then
            python -m scanner --test-messaggio
          else
            python -m scanner
          fi

      - name: Salva la memoria (articoli già visti)
        if: inputs.modalita != 'prova' && inputs.modalita != 'test-messaggio'
        run: |
          git config user.name "scanner-acquaviva"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Aggiorna memoria scanner [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
